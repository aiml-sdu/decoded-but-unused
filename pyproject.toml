[project]
name = "shingeki-no-features"
version = "0.2.0"
description = "Mechanistic interpretability of moral framing in Gemma-3-4B-IT (and replications)"
authors = [
    { name = "Phongsakon Mark Konrad" },
    { name = "Toygar Tanyel" },
    { name = "Serkan Ayvaz" },
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers>=4.46",
    "accelerate",
    "huggingface-hub",
    "datasets",
    "transformer-lens",
    "sae-lens",
    "openai",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tqdm",
    "jsonlines",
    "typer",
    "rich",
    "einops",
    "jaxtyping",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
]

[project.scripts]
shingeki = "shingeki.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shingeki"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU (deselect with '-m \"not gpu\"')",
    "slow: takes >5s",
]
